
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Recipes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">Food Recipes</a>

            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#navbarMenu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="index.html">Home</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Header -->
    <header class="bg-dark py-5">
        <div class="container text-center text-white">
            <h1 class="display-4 fw-bold">Delicious Recipes</h1>
            <p class="lead">Discover your favourite food recipes</p>
        </div>
    </header>

    <!-- Recipe Cards -->
    <section class="py-5">
        <div class="container">
            <div id="output"
                class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4">
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-4">
        <p class="mb-0">Food Recipes | Made with Bootstrap</p>
    </footer>

    <script>
        let display = document.getElementById("output");

        const fetchRecipes = async () => {
            try {
                const res = await fetch("https://dummyjson.com/recipes");
                const data = await res.json();

                let recipes = data.recipes;

                recipes.forEach(recipe => {
                    display.innerHTML += `
                        <div class="col">
                            <div class="card h-100 shadow-sm">

                                <img src="${recipe.image}"
                                    class="card-img-top"
                                    alt="${recipe.name}"
                                    style="height: 200px; object-fit: cover;">

                                <div class="card-body text-center">
                                    <h5 class="card-title fw-bold">
                                        ${recipe.name}
                                    </h5>

                                    <p class="text-muted">
                                        Cuisine: ${recipe.cuisine}
                                    </p>

                                    <p>
                                        ⭐ ${recipe.rating}
                                    </p>

                                    <p>
                                        ⏱ ${recipe.prepTimeMinutes +
                                            recipe.cookTimeMinutes} minutes
                                    </p>
                                </div>

                                <div class="card-footer bg-white text-center">
                                    <a href="ingredients.html?id=${recipe.id}"
                                        class="btn btn-dark">
                                        Ingredients
                                    </a>
                                </div>

                            </div>
                        </div>
                    `;
                });

            } catch (err) {
                console.log(err);
                display.innerHTML =
                    "<p class='text-danger'>Failed to load recipes.</p>";
            }
        };

        fetchRecipes();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
